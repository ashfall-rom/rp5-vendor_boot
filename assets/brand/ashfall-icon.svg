<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AshFall">
  <defs>
    <clipPath id="tile">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
    <radialGradient id="glow" cx="256" cy="300" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#FF8A3D" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#0B0C0F"/>
    <circle cx="256" cy="300" r="250" fill="url(#glow)"/>
  </g>

  <!-- "A" in two drifting ash strokes over a warm bloom. No ornament. -->
  <g fill="#EDE9E4">
    <path d="M244 112 C228 208 204 316 120 408 L186 408 C236 318 256 200 268 112 Z"/>
    <path d="M268 112 C284 208 308 316 392 408 L326 408 C276 318 256 200 244 112 Z"/>
    <rect x="196" y="281" width="120" height="38" rx="19"/>
  </g>
</svg>
